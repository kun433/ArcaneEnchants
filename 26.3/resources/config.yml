# ArcaneEnchants 配置
#
# 附魔的分层与属性定义在代码里（src/com/arcaneenchants/Defs.java），
# 这里只控制「获取概率 / 行为开关 / 提示文本」，改完执行 /ae reload 生效。
# language 决定附魔名与功能说明用中文还是英文，仅在服务端启动时读取，改语言需要重启。

language: zh_CN

loot:
  # 战利品箱是否投放本插件附魔书
  enabled: true
  # 简单附魔（可在附魔台刷出）在战利品箱中的出现概率
  simple-chance: 0.06
  # 复杂附魔（村民交易专属）在战利品箱中的稀有概率
  complex-chance: 0.008
  # 同一个箱子最多投放几本
  max-books-per-container: 1
  # 钓鱼战利品是否也投放
  allow-fishing: false
  # 按战利品表名过滤（包含即跳过），例如 chests/village
  table-blacklist: []

trades:
  # 是否允许图书管理员出售复杂附魔书
  enabled: true
  # 每次村民升级时，替换一格交易的概率
  chance: 0.35
  # 基础绿宝石价格，实际价格 = 该值 × 书等级
  emeralds: 24
  # 每格交易可使用次数
  max-uses: 3
  # 村民至少达到的等级（1 新手 ~ 5 大师）
  min-villager-level: 3
  # 只限图书管理员；false 则任意职业都可能出现
  require-librarian: true

attributes:
  # 是否把附魔属性写进物品的 attribute_modifiers（关闭后属性加成不生效）
  enabled: true
  # 背包属性兜底扫描间隔（tick），20 tick = 1 秒
  sync-interval-ticks: 100

behaviors:
  # 永固：耐久永不消耗
  eternal-durability: true
  # 贪婪：挖掘时额外掉落
  greed-extra-drops: true
  # 血契：造成伤害回复生命
  bloodpact-lifesteal: true
  # 血契回血冷却（毫秒）
  bloodpact-cooldown-ms: 500
  # 守望：低血量受击获得抗性提升
  warder-low-health: true
  # 守望触发冷却（秒）
  warder-cooldown-seconds: 20
  # 回响：命中点燃目标
  resonance-ignite: true

